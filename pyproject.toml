[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fgt-session-parser"
version = "0.1.0"
description = "Parse FortiGate 'diagnose sys session list' output into a readable table"
requires-python = ">=3.10"
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fgt-sessions = "fgt_sessions.cli:main"

[tool.setuptools.packages.find]
include = ["fgt_sessions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
